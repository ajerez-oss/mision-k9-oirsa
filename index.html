<style>
/* P13 — Mision K9: pantalla web adaptativa y control tactil */
html, body { margin:0!important; padding:0!important; width:100%; height:100%;
  overflow:hidden!important; overscroll-behavior:none; background:#00192e; }
html {touch-action:none;} body {-webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;}
#unity-container, #unity-container.unity-mobile, #unity-container.unity-desktop {
  position:fixed!important; inset:0!important; left:0!important; top:0!important;
  width:100vw!important; height:100vh!important; height:100dvh!important;
  transform:none!important; margin:0!important; padding:0!important; }
#unity-canvas, #unity-canvas.unity-mobile {
  display:block!important; width:100%!important; height:100%!important;
  position:absolute!important; inset:0!important; background:#00192e;
  touch-action:none!important; outline:none; }
#unity-footer {display:none!important;}
#unity-loading-bar {z-index:1000;}
#k9-fullscreen {
  position:fixed; right:max(10px,env(safe-area-inset-right));
  bottom:max(8px,env(safe-area-inset-bottom));
  z-index:10020; width:46px;height:46px; border:1px solid #20d8f9;
  border-radius:12px; background:rgba(0,25,54,.85); color:#fff;
  font-size:23px; cursor:pointer; touch-action:manipulation;}
#k9-guide {
  display:none;position:fixed;z-index:10030; left:50%; top:50%;
  transform:translate(-50%,-50%); box-sizing:border-box;
  width:min(92vw,440px); padding:20px; border:2px solid #20d8f9;
  border-radius:16px; background:rgba(0,25,54,.98);color:white;
  text-align:center;font:600 17px/1.45 system-ui,sans-serif;
  box-shadow:0 8px 32px rgba(0,0,0,.55);}
#k9-guide button {margin-top:12px;border:0;border-radius:10px;
  padding:10px 18px;background:#1cd0b8;color:#032036;font:700 16px system-ui;}
#k9-rotate {display:none; position:fixed; inset:0; z-index:10040;
  background:#041e3a;color:white;align-items:center;justify-content:center;
  font:700 24px/1.4 system-ui,sans-serif;text-align:center;padding:25px;}
@media (orientation: portrait) and (pointer:coarse){#k9-rotate{display:flex;}}
@media (display-mode:standalone){#k9-fullscreen{display:none;}}
</style>
<style>
/* MISION_K9_P14_WEB */
html,body{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden!important;background:#00192e;overscroll-behavior:none}
#unity-container{position:fixed!important;inset:0!important;left:0!important;top:0!important;width:100%!important;height:100dvh!important;margin:0!important;transform:none!important}
#unity-canvas{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:block!important;touch-action:none!important}
#unity-footer{display:none!important}
</style></head>
  <body>
<!-- MISION_K9_P13_MOBILE -->
<button id="k9-fullscreen" type="button" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
<div id="k9-guide" role="dialog" aria-live="polite">
  En Safari de iPhone, abrí <b>Compartir</b> → <b>Añadir a pantalla de inicio</b> →
  activá <b>Abrir como app web</b>. Luego abrí Misión K9 desde su icono.
  <div><button id="k9-guide-close" type="button">ENTENDIDO</button></div>
</div>
<div id="k9-rotate">↻<br/>Gir&aacute el teléfono horizontalmente para jugar Misión K9</div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/MisionK9_WEB_PUBLICAR.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/MisionK9_WEB_PUBLICAR.data",
        frameworkUrl: buildUrl + "/MisionK9_WEB_PUBLICAR.framework.js",
        codeUrl: buildUrl + "/MisionK9_WEB_PUBLICAR.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MisionK9OIRSA",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                window.k9UnityInstance = unityInstance;

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  
<script>
(function(){
  'use strict';
  var btn=document.getElementById('k9-fullscreen');
  var guide=document.getElementById('k9-guide');
  var close=document.getElementById('k9-guide-close');
  close.onclick=function(){guide.style.display='none';};
  btn.onclick=function(){
    if(document.fullscreenElement){
      if(document.exitFullscreen) document.exitFullscreen();
      return;
    }
    var target=document.getElementById('unity-container');
    var request=target.requestFullscreen || target.webkitRequestFullscreen;
    if(request){
      try { var r=request.call(target); if(r && typeof r.catch==='function')
        r.catch(function(){guide.style.display='block';}); }
      catch(e){guide.style.display='block';}
    } else {guide.style.display='block';}
  };
  document.addEventListener('fullscreenchange',function(){
    btn.textContent=document.fullscreenElement?'↙':'⛶';
  });
  var canvas=document.getElementById('unity-canvas');
  if(canvas){
    // Evita que un arrastre del joystick desplace la pagina de Safari.
    canvas.addEventListener('touchmove',function(e){if(e.cancelable)e.preventDefault();},{passive:false});
    canvas.addEventListener('gesturestart',function(e){if(e.cancelable)e.preventDefault();},{passive:false});
  }
})();
</script>

</body>
